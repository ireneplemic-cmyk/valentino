<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffd1e8, #ffb6d9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    z-index: 2;
}

h1 {
    color: #ff2f92;
    font-size: 3em;
    margin-bottom: 40px;
}

.buttons {
    position: relative;
    height: 160px;
}

button {
    font-size: 1.5em;
    padding: 15px 40px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    position: absolute;
}

#yes {
    background-color: #ff5fa2;
    color: white;
    left: 50%;
    transform: translateX(-140%);
}

#no {
    background-color: white;
    color: #ff5fa2;
    left: 50%;
    transform: translateX(40%);
}

/* effetti */
.effect {
    position: absolute;
    font-size: 26px;
    animation: explode 1.4s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0.3); opacity: 1; }
    to { transform: scale(3); opacity: 0; }
}

.final {
    position: absolute;
    font-size: 4em;
    color: #ff2f92;
    animation: pop 0.8s ease-out forwards;
}

@keyframes pop {
    from { transform: scale(0.2); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container" id="container">
    <h1>Lorenzello, vuoi essere il mio valentino? 💘</h1>
    <div class="buttons">
        <button id="yes">SI</button>
        <button id="no">NO</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const container = document.getElementById("container");

// sposta NO (sempre visibile)
function moveNoButton() {
    const x = Math.random() * (window.innerWidth - 140);
    const y = Math.random() * (window.innerHeight - 80);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// PC: scappa dal cursore
document.addEventListener("mousemove", e => {
    const rect = noBtn.getBoundingClientRect();
    const dist = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
    );
    if (dist < 140) moveNoButton();
});

// Mobile: scappa al tocco (NON scompare)
noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    moveNoButton();
});

// SI → APOCALISSE
yesBtn.addEventListener("click", () => {
    container.style.display = "none";

    const finalText = document.createElement("div");
    finalText.className = "final";
    finalText.innerHTML = "e menomale!";
    document.body.appendChild(finalText);

    const symbols = ["❤️","🎆","🎉","⭐","⚡"];

    setInterval(() => {
        for (let i = 0; i < 35; i++) {
            const el = document.createElement("div");
            el.className = "effect";
            el.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
            el.style.left = Math.random() * window.innerWidth + "px";
            el.style.top = Math.random() * window.innerHeight + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1400);
        }
    }, 350);
});
</script>

</body>
</html>
