<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffd6e8, #ffeaf3);
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #d63384;
  text-align: center;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 { font-size: 2.2rem; margin-bottom: 40px; }
.buttons { display: flex; gap: 30px; }
button {
  padding: 15px 30px;
  font-size: 1.1rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}
#yes { background: #ff69b4; color: white; }
#no { background: white; color: #ff69b4; position: absolute; }

/* SECONDA PAGINA */
#second-page { display: none; flex-direction: column; align-items: center; }

/* MENOMALE + GATTINO */
#final-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}
#final-text { font-size: 2.2rem; opacity: 0; transform: scale(0.2); }
#cat-img { width: 180px; height: auto; margin-bottom: 10px; opacity:0; }

/* FRASE LETTERA PER LETTERA */
#date-text, #final-text2 {
  font-size: 1.8rem;
  opacity: 0;
  margin: 5px 0;
  font-weight: 600;
}

/* città pulsanti */
.city { font-weight: 600; display: inline-block; animation: pulse 3s infinite; }
.city:nth-child(1) { animation-delay: 0s; }
.city:nth-child(2) { animation-delay: 1s; }
.city:nth-child(3) { animation-delay: 2s; }

@keyframes pulse {
  0% { transform: scale(1); color:#d63384; }
  50% { transform: scale(1.3); color:#ff1493; }
  100% { transform: scale(1); color:#d63384; }
}

/* PARTICELLE CUORI & STELLE */
.particle {
  position: absolute;
  font-size: 22px;
  pointer-events: none;
  animation: float 6s linear infinite;
}
@keyframes float { from { transform: translateY(0); opacity:1; } to { transform: translateY(-800px); opacity:0; } }

@media (max-width:600px) {
  h1 { font-size: 1.8rem; }
  #final-text, #final-text2 { font-size: 1.5rem; }
  #date-text { font-size: 1.4rem; }
  #cat-img { width: 140px; }
}
</style>
</head>
<body>

<!-- PAGINA 1 -->
<div class="page" id="first-page">
  <h1>Lorenzello,<br>vuoi essere il mio Valentino? 💗</h1>
  <div class="buttons">
    <button id="yes">SI</button>
    <button id="no">NO</button>
  </div>
</div>

<!-- PAGINA 2 -->
<div class="page" id="second-page">
  <div id="final-container">
    <img id="cat-img" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgH..." alt="Gattino">
    <div id="final-text">… e menomaleeeee 💖</div>
  </div>
  <div id="date-text">allora ci vediamo il 13/02/26 a <span class="city">Roma</span> / <span class="city">Milano</span> / <span class="city">Vicenzola</span>!</div>
  <div id="final-text2"><em>non vedo l'ora L &lt;3</em></div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const firstPage = document.getElementById("first-page");
const secondPage = document.getElementById("second-page");
const finalText = document.getElementById("final-text");
const catImg = document.getElementById("cat-img");
const dateText = document.getElementById("date-text");
const finalText2 = document.getElementById("final-text2");

/* NO SCAPPA */
function moveNo() {
  noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
}
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", e => { e.preventDefault(); moveNo(); });

/* CLICK SI */
yesBtn.addEventListener("click", () => {
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  firstPage.style.display = "none";
  secondPage.style.display = "flex";

  // mostra gattino + menomale
  catImg.style.opacity = 1;
  finalText.style.opacity = 1;

  // lancia caos emoji
  startInfiniteChaos();

  // seconda frase lettera per lettera subito
  typeText(dateText, 30);

  // terza frase dopo 2s
  setTimeout(() => {
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    typeText(finalText2, 50);
  }, 2000);
});

/* TYPE LETTERA PER LETTERA */
function typeText(element, speed) {
  const text = element.innerText;
  element.innerText = '';
  element.style.opacity = 1;
  let i = 0;
  const interval = setInterval(() => {
    element.innerText += text.charAt(i);
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

/* CAOS ETERNO CUORI & STELLE */
function startInfiniteChaos() {
  const symbols = ["💖","❤️","🤍","✨","⭐"];
  setInterval(() => {
    const p = document.createElement("div");
    p.className = "particle";
    p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*window.innerWidth + "px";
    p.style.top = window.innerHeight + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),6000);
  }, 120);
}
</script>
</body>
</html>
