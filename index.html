<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffd1e8, #ffb6d9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    z-index: 2;
}

h1 {
    color: #ff2f92;
    font-size: 3em;
    margin-bottom: 40px;
}

.buttons {
    position: relative;
    height: 140px;
}

button {
    font-size: 1.5em;
    padding: 15px 40px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    position: absolute;
}

#yes {
    background-color: #ff5fa2;
    color: white;
    left: 50%;
    transform: translateX(-130%);
}

#no {
    background-color: white;
    color: #ff5fa2;
    left: 50%;
    transform: translateX(30%);
}

/* glitter */
.glitter {
    position: absolute;
    width: 6px;
    height: 6px;
    background: pink;
    border-radius: 50%;
    opacity: 0.8;
    animation: glitterFall 5s linear forwards;
}

@keyframes glitterFall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(110vh); }
}

/* fuochi */
.firework {
    position: absolute;
    font-size: 24px;
    animation: explode 1.3s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0.2); opacity: 1; }
    to { transform: scale(3); opacity: 0; }
}

/* scritta finale */
.final {
    position: absolute;
    font-size: 4em;
    color: #ff2f92;
    animation: pop 1s ease-out forwards;
}

@keyframes pop {
    from { transform: scale(0.2); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container" id="container">
    <h1>Lorenzello, vuoi essere il mio valentino? 💘</h1>
    <div class="buttons">
        <button id="yes">SI</button>
        <button id="no">NO</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const container = document.getElementById("container");

// sposta NO
function moveNoButton() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// PC: scappa dal cursore
document.addEventListener("mousemove", e => {
    const rect = noBtn.getBoundingClientRect();
    const dist = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
    );
    if (dist < 120) moveNoButton();
});

// Mobile: scappa al tocco
noBtn.addEventListener("touchstart", moveNoButton);

// SI → APOCALISSE ROSA
yesBtn.addEventListener("click", () => {
    container.style.display = "none";

    // scritta finale
    const finalText = document.createElement("div");
    finalText.className = "final";
    finalText.innerHTML = "eh direi!";
    document.body.appendChild(finalText);

    // tanti fuochi ripetuti
    let fireworksInterval = setInterval(() => {
        for (let i = 0; i < 25; i++) {
            const fw = document.createElement("div");
            fw.className = "firework";
            fw.innerHTML = "❤️";
            fw.style.left = Math.random() * window.innerWidth + "px";
            fw.style.top = Math.random() * window.innerHeight + "px";
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1300);
        }
    }, 400);

    // glitter infinito
    setInterval(() => {
        const g = document.createElement("div");
        g.className = "glitter";
        g.style.left = Math.random() * window.innerWidth + "px";
        g.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(g);
        setTimeout(() => g.remove(), 5000);
    }, 80);
});
</script>

</body>
</html>
