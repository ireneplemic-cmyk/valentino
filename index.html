<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentino 💗</title>

  <!-- Font carino -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #ffd6e8, #ffeaf3);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #d63384;
      text-align: center;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yes {
      background-color: #ff69b4;
      color: white;
    }

    #no {
      background-color: #fff;
      color: #ff69b4;
      position: absolute;
    }

    /* Seconda pagina */
    #second-page {
      display: none;
    }

    #final-text {
      font-size: 1.8rem;
      opacity: 0;
      transform: scale(0.2);
      animation: zoomIn 3s forwards;
    }

    @keyframes zoomIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #date-text {
      margin-top: 25px;
      font-size: 1.1rem;
      opacity: 0;
    }

    /* Particelle */
    .particle {
      position: absolute;
      font-size: 20px;
      animation: explode 3s linear forwards;
      pointer-events: none;
    }

    @keyframes explode {
      from {
        transform: translate(0,0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--x), var(--y)) scale(0.3);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      #final-text {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- PAGINA 1 -->
  <div class="page" id="first-page">
    <h1>Lorenzello,<br>vuoi essere il mio Valentino? 💗</h1>
    <div class="buttons">
      <button id="yes">SI</button>
      <button id="no">NO</button>
    </div>
  </div>

  <!-- PAGINA 2 -->
  <div class="page" id="second-page">
    <div id="final-text">… e menomaleeeee 💖</div>
    <div id="date-text">allora ci vediamo il 13/02/26 a Roma/Milano/Vicenzola!</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const firstPage = document.getElementById("first-page");
    const secondPage = document.getElementById("second-page");
    const dateText = document.getElementById("date-text");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // scappa SEMPRE
    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNo();
    });

    yesBtn.addEventListener("click", () => {
      firstPage.style.display = "none";
      secondPage.style.display = "flex";
      startChaos();

      setTimeout(() => {
        dateText.style.opacity = 1;
      }, 4000);
    });

    function startChaos() {
      const symbols = ["💖","💥","✨","🎉","💫","⭐","💘"];
      for (let i = 0; i < 200; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
        p.style.left = Math.random() * window.innerWidth + "px";
        p.style.top = Math.random() * window.innerHeight + "px";
        p.style.setProperty("--x", (Math.random()*600-300)+"px");
        p.style.setProperty("--y", (Math.random()*600-300)+"px");
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
      }
    }
  </script>

</body>
</html>
