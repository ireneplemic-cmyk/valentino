<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: pink;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #e60073;
  font-size: 3em;
}

button {
  font-size: 1.4em;
  padding: 15px 40px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  position: absolute;
}

#yes {
  background: #ff4da6;
  color: white;
  left: 40%;
  top: 55%;
}

#no {
  background: white;
  color: #ff4da6;
  left: 55%;
  top: 55%;
}

/* effetti */
.effect {
  position: absolute;
  font-size: 28px;
  animation: boom 1.2s forwards;
}

@keyframes boom {
  from { transform: scale(0.3); opacity: 1; }
  to { transform: scale(3); opacity: 0; }
}

.final {
  font-size: 4em;
  color: #e60073;
}
</style>
</head>

<body>

<div class="container" id="container">
  <h1>Lorenzello, vuoi essere il mio valentino? 💘</h1>
  <button id="yes">SI</button>
  <button id="no">NO</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const container = document.getElementById("container");

function moveNo() {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// PC: scappa dal cursore
document.addEventListener("mousemove", e => {
  const r = noBtn.getBoundingClientRect();
  const d = Math.hypot(
    e.clientX - (r.left + r.width / 2),
    e.clientY - (r.top + r.height / 2)
  );
  if (d < 120) moveNo();
});

// Mobile: scappa dal tocco
noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  moveNo();
});

// SI → CAOS
yesBtn.addEventListener("click", () => {
  container.innerHTML = `<div class="final">e menomale!</div>`;

  const symbols = ["🎆","🎉","⭐","⚡","❤️"];

  setInterval(() => {
    for (let i = 0; i < 40; i++) {
      const el = document.createElement("div");
      el.className = "effect";
      el.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left = Math.random()*window.innerWidth + "px";
      el.style.top = Math.random()*window.innerHeight + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
  }, 300);
});
</script>

</body>
</html>
