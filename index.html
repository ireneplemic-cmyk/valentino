<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffd1e8, #ffb6d9);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #e60073;
  font-size: 2.5em;
  margin-bottom: 30px;
}

button {
  font-size: 1.3em;
  padding: 15px 40px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  position: absolute;
}

#yes {
  background: #ff4da6;
  color: white;
  left: 35%;
  top: 60%;
}

#no {
  background: white;
  color: #ff4da6;
  left: 55%;
  top: 60%;
}

/* adattamento mobile */
@media (max-width: 600px) {
  #yes { left: 20%; top: 65%; }
  #no  { left: 55%; top: 65%; }
}

/* seconda schermata */
.final {
  position: absolute;
  font-size: 3.5em;
  color: #e60073;
  animation: zoomIn 3s ease-out forwards;
}

@keyframes zoomIn {
  from { transform: scale(0.1); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.subtext {
  position: absolute;
  top: 65%;
  font-size: 1.6em;
  color: #ff2f92;
  opacity: 0;
  animation: fadeIn 1s ease-out forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* effetti */
.effect {
  position: absolute;
  font-size: 26px;
  animation: boom 1.2s forwards;
}

@keyframes boom {
  from { transform: scale(0.3); opacity: 1; }
  to   { transform: scale(3); opacity: 0; }
}
</style>
</head>

<body>

<div class="container" id="container">
  <h1>Lorenzello, vuoi essere il mio valentino? 💘</h1>
  <button id="yes">SI</button>
  <button id="no">NO</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const container = document.getElementById("container");

// NO scappa SEMPRE
function moveNo() {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

document.addEventListener("mousemove", e => {
  const r = noBtn.getBoundingClientRect();
  const d = Math.hypot(
    e.clientX - (r.left + r.width / 2),
    e.clientY - (r.top + r.height / 2)
  );
  if (d < 120) moveNo();
});

noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  moveNo();
});

// SI → SECONDA PAGINA
yesBtn.addEventListener("click", () => {
  container.innerHTML = `<div class="final">... e menomaleeeee</div>`;

  const symbols = ["🎆","🎉","⭐","⚡","❤️"];

  // caos continuo
  setInterval(() => {
    for (let i = 0; i < 35; i++) {
      const el = document.createElement("div");
      el.className = "effect";
      el.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left = Math.random()*window.innerWidth + "px";
      el.style.top = Math.random()*window.innerHeight + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
  }, 300);

  // testo dopo 4 secondi
  setTimeout(() => {
    const sub = document.createElement("div");
    sub.className = "subtext";
    sub.innerHTML = "allora ci vediamo il 13/02/26 a Roma/Milano/Vicenzola!";
    document.body.appendChild(sub);
  }, 4000);
});
</script>

</body>
</html>
