<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffd6e8, #ffeaf3);
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #d63384;
  text-align: center;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 2.2rem;
  margin-bottom: 40px;
}

.buttons {
  display: flex;
  gap: 30px;
}

button {
  padding: 15px 30px;
  font-size: 1.1rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff69b4;
  color: white;
}

#no {
  background: white;
  color: #ff69b4;
  position: absolute;
}

/* PAGINA 2 */
#second-page {
  display: none;
}

/* MENOMALE */
#final-text {
  font-size: 2.2rem;
  opacity: 0;
  transform: scale(0.2);
  animation: zoomIn 3s forwards;
}

/* FRASE 13 */
#date-text {
  margin-top: 28px;
  font-size: 1.6rem;
  opacity: 0;
}

/* GATTINO */
#kitty {
  margin-top: 25px;
  width: 220px;
  border-radius: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  opacity: 0;
}

/* FRASE FINALE */
#love-text {
  margin-top: 18px;
  font-size: 1.1rem;
  font-style: italic;
  color: #c2185b;
  opacity: 0;
}

/* città pulsanti */
.city {
  font-weight: 600;
  display: inline-block;
  animation: pulse 3s infinite;
}

.city:nth-child(1) { animation-delay: 0s; }
.city:nth-child(2) { animation-delay: 1s; }
.city:nth-child(3) { animation-delay: 2s; }

@keyframes zoomIn {
  to { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
  0% { transform: scale(1); color:#d63384; }
  50% { transform: scale(1.35); color:#ff1493; }
  100% { transform: scale(1); color:#d63384; }
}

/* PARTICELLE */
.particle {
  position: absolute;
  font-size: 22px;
  pointer-events: none;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(0); opacity:1; }
  to { transform: translateY(-800px); opacity:0; }
}

@media (max-width:600px) {
  h1 { font-size: 1.8rem; }
  #final-text { font-size: 1.8rem; }
  #date-text { font-size: 1.35rem; }
  #kitty { width: 200px; }
}
</style>
</head>

<body>

<!-- PAGINA 1 -->
<div class="page" id="first-page">
  <h1>Lorenzello,<br>vuoi essere il mio Valentino? 💗</h1>
  <div class="buttons">
    <button id="yes">SI</button>
    <button id="no">NO</button>
  </div>
</div>

<!-- PAGINA 2 -->
<div class="page" id="second-page">
  <div id="final-text">… e menomaleeeee</div>

  <div id="date-text">
    allora ci vediamo il 13/02/26 a
    <span class="city">Roma</span> /
    <span class="city">Milano</span> /
    <span class="city">Vicenzola</span>!
  </div>

  <img id="kitty" src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=400" alt="gattino dolcissimo">

  <div id="love-text">non vedo l’ora Valentino mio</div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const firstPage = document.getElementById("first-page");
const secondPage = document.getElementById("second-page");
const dateText = document.getElementById("date-text");
const kitty = document.getElementById("kitty");
const loveText = document.getElementById("love-text");

/* NO SCAPPA SEMPRE */
function moveNo() {
  noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  moveNo();
});
noBtn.addEventListener("touchmove", moveNo);

/* CLICK SI */
yesBtn.addEventListener("click", () => {

  if (navigator.vibrate) {
    navigator.vibrate([200,100,200,100,300]);
  }

  firstPage.style.display = "none";
  secondPage.style.display = "flex";

  // dopo 4s → frase del 13 + caos
  setTimeout(() => {
    dateText.style.opacity = 1;
    startInfiniteChaos();
  }, 4000);

  // dopo 6s → gattino + frase finale
  setTimeout(() => {
    kitty.style.opacity = 1;
    loveText.style.opacity = 1;
  }, 6000);
});

/* CAOS ETERNO */
function startInfiniteChaos() {
  const symbols = ["💖","✨","🎆","🎉","⭐","💘","💥"];
  setInterval(() => {
    const p = document.createElement("div");
    p.className = "particle";
    p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*window.innerWidth + "px";
    p.style.top = window.innerHeight + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),6000);
  }, 120);
}
</script>

</body>
</html>
