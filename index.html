<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💗</title>
<style>
body {
  margin:0;
  font-family: sans-serif;
  background: linear-gradient(180deg,#ffd6e8,#ffeaf3);
  overflow:hidden;
  text-align:center;
}
.page { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; width:100vw; position:relative; }
button { padding:15px 30px; border-radius:30px; border:none; font-size:1.2rem; cursor:pointer; }
#yes { background:#ff69b4;color:white; margin-right:20px; }
#no { background:white;color:#ff69b4; position:absolute; }

#second-page { display:none; flex-direction:column; align-items:center; }
#final-container { display:flex; flex-direction:column; align-items:center; margin-bottom:20px; }
#cat-img { width:180px; margin-bottom:10px; }
#final-text, #date-text, #final-text2 { font-size:1.8rem; font-weight:600; margin:5px 0; }
#final-text2 em { font-style:italic; }

/* PARTICELLE */
.particle { position:absolute; font-size:22px; pointer-events:none; animation:float 6s linear infinite; }
@keyframes float { from {transform:translateY(0); opacity:1;} to {transform:translateY(-800px); opacity:0;} }
</style>
</head>
<body>

<div class="page" id="first-page">
  <h1>Lorenzello,<br>vuoi essere il mio Valentino? 💗</h1>
  <div>
    <button id="yes">SI</button>
    <button id="no">NO</button>
  </div>
</div>

<div class="page" id="second-page">
  <div id="final-container">
    <img id="cat-img" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgH..." alt="Gattino">
    <div id="final-text">… e menomaleeeee 💖</div>
  </div>
  <div id="date-text">allora ci vediamo il 13/02/26 a Roma / Milano / Vicenzola!</div>
  <div id="final-text2"><em>non vedo l'ora L &lt;3</em></div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const firstPage=document.getElementById("first-page");
const secondPage=document.getElementById("second-page");
const finalText=document.getElementById("final-text");
const catImg=document.getElementById("cat-img");
const dateText=document.getElementById("date-text");
const finalText2=document.getElementById("final-text2");

/* NO SCAPPA */
function moveNo(){noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";noBtn.style.top=Math.random()*(window.innerHeight-100)+"px";}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",e=>{e.preventDefault();moveNo();});

/* CLICK SI */
yesBtn.addEventListener("click",()=>{
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  firstPage.style.display="none";
  secondPage.style.display="flex";

  // mostra gattino e menomale subito
  catImg.style.display="block";
  finalText.style.display="block";

  // seconda frase lettera per lettera subito
  typeText(dateText,30);

  // terza frase dopo 2s con vibrazione
  setTimeout(()=>{ if(navigator.vibrate) navigator.vibrate([200,100,200]); typeText(finalText2,50); },2000);

  // caos emoji
  startChaos();
});

/* LETTERA PER LETTERA */
function typeText(el,speed){
  const text=el.innerText;
  el.innerText="";
  el.style.opacity=1;
  let i=0;
  const interval=setInterval(()=>{
    el.innerText+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(interval);
  },speed);
}

/* PARTICELLE CUORI & STELLE */
function startChaos(){
  const symbols=["💖","❤️","🤍","✨","⭐"];
  setInterval(()=>{
    const p=document.createElement("div");
    p.className="particle";
    p.innerText=symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left=Math.random()*window.innerWidth+"px";
    p.style.top=window.innerHeight+"px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),6000);
  },120);
}
</script>
</body>
</html>
