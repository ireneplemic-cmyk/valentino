<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentino 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffd6e8, #ffeaf3);
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #d63384;
  text-align: center;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 2.2rem;
  margin-bottom: 40px;
}

.buttons {
  display: flex;
  gap: 30px;
}

button {
  padding: 15px 32px;
  font-size: 1.1rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff69b4;
  color: white;
}

#no {
  background: white;
  color: #ff69b4;
  position: absolute;
}

/* PAGINA 2 */
#second-page {
  display: none;
}

#final-text {
  font-size: 2.3rem;
  opacity: 0;
  transform: scale(0.2);
  animation: zoomIn 3s forwards;
  position: relative;
  z-index: 2;
}

/* FRASE 13 */
#date-text {
  margin-top: 30px;
  font-size: 1.8rem;
  opacity: 0;
}

/* CITTÀ */
.city {
  font-weight: 600;
  display: inline-block;
  animation: pulse 3s infinite;
}

.city:nth-child(1){animation-delay:0s}
.city:nth-child(2){animation-delay:1s}
.city:nth-child(3){animation-delay:2s}

/* FRASE FINALE */
#final-love {
  margin-top: 20px;
  font-style: italic;
  font-size: 1.5rem;
  opacity: 0;
  min-height: 1.5em;
}

/* GATTINO */
#kitty {
  margin-bottom: 20px;
  width: 200px;
  height: auto;
  border-radius: 15px;
  opacity: 0;
  transform: scale(0.2);
  transition: transform 1s ease, opacity 1s ease;
}

/* GLITTER & FACCE DOLCI */
.particle {
  position: absolute;
  font-size: 22px;
  pointer-events: none;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(0); opacity:1; }
  to { transform: translateY(-800px); opacity:0; }
}

@keyframes zoomIn {
  to { opacity:1; transform:scale(1); }
}

@keyframes pulse {
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

@media (max-width:600px){
  h1{font-size:1.8rem}
  #final-text{font-size:2rem}
  #date-text{font-size:1.5rem}
}
</style>
</head>

<body>

<!-- PAGINA 1 -->
<div class="page" id="first-page">
  <h1>Lorenzello,<br>vuoi essere il mio Valentino? 💗</h1>
  <div class="buttons">
    <button id="yes">SI</button>
    <button id="no">NO</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const firstPage = document.getElementById("first-page");
const secondPage = document.getElementById("second-page");
const dateText = document.getElementById("date-text");
const finalLove = document.getElementById("final-love");
const kitty = document.getElementById("kitty");
const finalText = document.getElementById("final-text");

/* NO SCAPPA SEMPRE */
function moveNo(){
  noBtn.style.left = Math.random()*(window.innerWidth-120)+"px";
  noBtn.style.top = Math.random()*(window.innerHeight-120)+"px";
}
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", e=>{
  e.preventDefault();
  moveNo();
});

/* CLICK SI */
yesBtn.addEventListener("click", ()=>{
  if(navigator.vibrate) navigator.vibrate([200,100,200]);

  firstPage.style.display="none";
  secondPage.style.display="flex";

  // MOSTRA MENOMALE + GATTINO E INIZIA ESPLOSIONE EMOJI
  finalTextAppear();
});

function finalTextAppear(){
  // menomale + kitty
  finalText.style.opacity = 1;
  kitty.style.opacity = 1;
  kitty.style.transform = "scale(1)";
  if(navigator.vibrate) navigator.vibrate([300,100,300]);

  startEmojiExplosion();

  // dopo 4s mostra data
  setTimeout(()=>{
    dateText.style.opacity = 1;

    // dopo altri 2s mostra frase finale
    setTimeout(()=>{
      typeFinalText("non vedo l'ora L <3");
      if(navigator.vibrate) navigator.vibrate([300,100,300]);
    },2000);

  },4000);
}

/* ESPLOSIONE EMOJI DOLCI */
function startEmojiExplosion(){
  const symbols=["💖","💕","💘","✨","💫","🥹","🩷"];
  setInterval(()=>{
    const p=document.createElement("div");
    p.className="particle";
    p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*window.innerWidth+"px";
    p.style.top = window.innerHeight+"px";
    document.body.appendChild(p);
    if(navigator.vibrate) navigator.vibrate(50); // vibrazione emoji
    setTimeout(()=>p.remove(),6000);
  },120);
}

/* TYPING FINALE */
function typeFinalText(text){
  finalLove.style.opacity = 1;
  let i=0;
  const interval = setInterval(()=>{
    finalLove.textContent += text[i];
    i++;
    if(i>=text.length) clearInterval(interval);
  },90);
}
</script>
